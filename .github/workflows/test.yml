name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only token: a compromised third-party action can't push or change the repo.
permissions:
  contents: read

# Compile and run lsp-mode with plists, as ~/.emacs.d/early-init.el from
# the dotfiles does on every machine.  lsp-mode bakes this in when it is
# byte-compiled, so it is part of the package cache key below.
env:
  LSP_USE_PLISTS: "true"

jobs:
  test:
    name: ${{ matrix.os }} / Emacs ${{ matrix.emacs }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false            # let every platform finish, so all failures show
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs: ['31.1']

    steps:
      - uses: actions/checkout@v7

      # The third-party action is pinned to a full commit SHA, so a later push
      # to it can't change what runs here.  Dependabot proposes updates.
      - name: Install Emacs (Linux, macOS)
        if: runner.os != 'Windows'
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7  # master, 2026-11-21
        with:
          version: ${{ matrix.emacs }}

      # On Windows, use GNU's official build directly rather than a
      # third-party action (the one available lags behind new releases).
      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ matrix.emacs }}"
          $major = $version.Split('.')[0]
          $url = "https://ftpmirror.gnu.org/emacs/windows/emacs-$major/emacs-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\emacs.zip"
          7z x "$env:RUNNER_TEMP\emacs.zip" -oC:\emacs -y | Out-Null
          $bin = (Get-ChildItem C:\emacs -Recurse -Filter emacs.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\emacs.exe" --version

      # Tools the environment test requires, plus cmake/libtool, which vterm
      # needs to compile its module.  No libvterm-dev: this Emacs is a Nix
      # build that doesn't search /usr/lib, so a module linked against the
      # system libvterm can't be opened.  Without it, vterm builds its
      # vendored libvterm into the module.
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pkg-config enchant-2 libenchant-2-dev cmake libtool-bin

      # Run the setup script, so CI tests it and has the same tools as
      # a Mac set up with it.  Check that the Claude Code CLI it installs
      # actually runs, since the environment test only checks it's on PATH.
      # Then put the directories that the README's ~/.emacs.d/init.el adds
      # to exec-path (TeX, Go) on PATH as well.
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          bash etc/macos-setup.sh
          claude --version
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      # Python language servers for the integration test, which starts
      # them on a Python file.  pipx is preinstalled on all runners.
      - name: Install Python language servers
        shell: bash
        run: |
          pipx install ruff
          pipx install basedpyright
          echo "$(pipx environment --value PIPX_BIN_DIR)" >> "$GITHUB_PATH"

      # On Windows, Emacs uses HOME for ~ when it is set.  Point it at the
      # user profile so ~/.emacs.d matches the cache path below.
      - name: Set HOME (Windows)
        if: runner.os == 'Windows'
        run: echo "HOME=$env:USERPROFILE" >> $env:GITHUB_ENV

      # The month in the cache key makes CI install current package versions
      # at least once a month; otherwise it would keep testing the versions
      # from whenever emacs.el last changed.  restore-keys stays within the
      # month: use-package only installs missing packages and never upgrades
      # them, so restoring an older month's cache would keep its versions.
      - name: Get month
        id: month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ~/.emacs.d/elpa
          key: elpa-plists-${{ runner.os }}-${{ matrix.emacs }}-${{ steps.month.outputs.month }}-${{ hashFiles('emacs.el') }}
          restore-keys: elpa-plists-${{ runner.os }}-${{ matrix.emacs }}-${{ steps.month.outputs.month }}-

      - name: Run tests
        run: emacs --batch -l test/run-all.el

      # Record which package versions this run installed and tested: listed
      # in the job summary and uploaded as a text-file artifact.  With
      # archive: false the file isn't zipped, so it opens in the browser,
      # and the artifact takes the file's name.  GitHub keeps both for 90
      # days.  Uploading needs no extra token permissions.
      - name: Write package manifest
        if: always()
        shell: bash
        run: >-
          emacs --batch -l etc/package-manifest.el -f package-manifest-write
          "package-manifest-${{ runner.os }}.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: package-manifest-${{ runner.os }}.txt
          archive: false
          if-no-files-found: warn
