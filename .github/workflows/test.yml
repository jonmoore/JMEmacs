name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only token: a compromised third-party action can't push or change the repo.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Emacs ${{ matrix.emacs }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false            # let every platform finish, so all failures show
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs: ['31.1']

    steps:
      - uses: actions/checkout@v7

      # The third-party action is pinned to a full commit SHA, so a later push
      # to it can't change what runs here.  Dependabot proposes updates.
      - name: Install Emacs (Linux, macOS)
        if: runner.os != 'Windows'
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7  # master, 2026-11-21
        with:
          version: ${{ matrix.emacs }}

      # On Windows, use GNU's official build directly rather than a
      # third-party action (the one available lags behind new releases).
      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ matrix.emacs }}"
          $major = $version.Split('.')[0]
          $url = "https://ftpmirror.gnu.org/emacs/windows/emacs-$major/emacs-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\emacs.zip"
          7z x "$env:RUNNER_TEMP\emacs.zip" -oC:\emacs -y | Out-Null
          $bin = (Get-ChildItem C:\emacs -Recurse -Filter emacs.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\emacs.exe" --version

      # Tools the environment test requires, plus cmake/libtool, which vterm
      # needs to compile its module.  No libvterm-dev: this Emacs is a Nix
      # build that doesn't search /usr/lib, so a module linked against the
      # system libvterm can't be opened.  Without it, vterm builds its
      # vendored libvterm into the module.
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pkg-config enchant-2 libenchant-2-dev cmake libtool-bin

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep pkg-config enchant cmake libtool libvterm

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      # On Windows, Emacs uses HOME for ~ when it is set.  Point it at the
      # user profile so ~/.emacs.d matches the cache path below.
      - name: Set HOME (Windows)
        if: runner.os == 'Windows'
        run: echo "HOME=$env:USERPROFILE" >> $env:GITHUB_ENV

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.emacs.d/elpa
          key: elpa-${{ runner.os }}-${{ matrix.emacs }}-${{ hashFiles('emacs.el') }}
          restore-keys: elpa-${{ runner.os }}-${{ matrix.emacs }}-

      - name: Run tests
        run: emacs --batch -l test/run-all.el
